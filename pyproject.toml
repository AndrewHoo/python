[project]
name = "python"
version = "0.0.1"
description = "python language tools, patterns, algorithms and data structures"
readme = "README.md"
authors = [{ name="Andrew Hoo", email="andrew.hoo@gmail.com" }]
maintainers = [{ name="Andrew Hoo", email="andrew.hoo@gmail.com" }]
license = "MIT"
license-files = [ "LICENSE" ]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

dependencies = []

[project.optional-dependencies]
all = [
    "python[lint]",
    "python[tests]",
    "python[api]",
]
lint = [
    "ruff",
    "ciqar",
    "ansi2html"
]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-html",
    "pytest-md-report"
]
api = [
    "pdoc3"
]

[project.urls]
source = "https://github.com/AndrewHoo/python"

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "src" ]
